[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finops_agent"
version = "0.1.0"
description = "AgentCore Runtime FinOps agent: daily AWS cost data split into LLM, infrastructure, networking and project costs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.24.0",
    "boto3 >= 1.40.0",
    "botocore[crt] >= 1.40.0",
    "strands-agents >= 1.57.0",
]

[project.optional-dependencies]
dev = ["pytest >= 8"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
